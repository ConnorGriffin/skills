name: Publish documentation site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate skill pack
        run: >-
          python3 scripts/validate.py && python3 -m unittest
          tests.test_behavior tests.test_pr_body tests.test_pr_body_gate
          tests.test_pr_body_bench tests.test_ticket
          tests.test_codebase_memory_install tests.test_check_dco
          tests.test_ci_changed_paths && python3 -m py_compile
          skills/tools/codebase-memory/scripts/install.py scripts/ci_changed_paths.py
          skills/drivers/orchestrate/scripts/worker_lifecycle.py
          skills/drivers/orchestrate/scripts/codex-worker.py
          skills/drivers/orchestrate/scripts/claude-worker.py && python3 -m unittest
          tests.test_site_build
      - name: Build documentation site
        run: python3 site/build.py --out _site
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
